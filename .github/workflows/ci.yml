name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Build & Test Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore dependencies
        run: dotnet restore src/DentalClinic.Api/DentalClinic.Api.csproj

      - name: Build
        run: dotnet build src/DentalClinic.Api/DentalClinic.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/DentalClinic.Api/DentalClinic.Api.csproj --configuration Release --no-build --output ./publish

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dental-clinic-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dental-clinic-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t dental-clinic-api .

  electron-windows:
    name: Electron Build (Windows)
    runs-on: windows-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: dental-clinic-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dental-clinic-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build --configuration production

      - name: Build Electron (Windows)
        run: npx electron-builder build --win --publish never

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: dental-clinic-windows
          path: dental-clinic-frontend/release/*.exe

  electron-macos:
    name: Electron Build (macOS)
    runs-on: macos-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: dental-clinic-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dental-clinic-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build --configuration production

      - name: Build Electron (macOS)
        run: npx electron-builder build --mac --publish never

      - name: Upload macOS Installer
        uses: actions/upload-artifact@v4
        with:
          name: dental-clinic-macos
          path: dental-clinic-frontend/release/*.dmg

  electron-linux:
    name: Electron Build (Linux)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: dental-clinic-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dental-clinic-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: npx ng build --configuration production

      - name: Build Electron (Linux)
        run: npx electron-builder build --linux --publish never

      - name: Upload Linux Installer
        uses: actions/upload-artifact@v4
        with:
          name: dental-clinic-linux
          path: |
            dental-clinic-frontend/release/*.AppImage
            dental-clinic-frontend/release/*.deb
