version: "3.8"

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "DentalClinic@2024!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "DentalClinic@2024!" -Q "SELECT 1" -C -No || exit 1
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7000:7000"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver;Database=DentalClinic;User Id=sa;Password=DentalClinic@2024!;TrustServerCertificate=true"
      Jwt__Key: "DentalClinicPortalSuperSecretKey2024!XyZ#"
      Jwt__Issuer: "DentalClinicApi"
      Jwt__Audience: "DentalClinicPortal"
      Jwt__ExpiryHours: "8"
    volumes:
      - api-uploads:/app/uploads
      - api-logs:/app/logs
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  sqlserver-data:
  api-uploads:
  api-logs:
